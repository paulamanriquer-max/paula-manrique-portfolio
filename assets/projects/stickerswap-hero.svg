<svg xmlns="http://www.w3.org/2000/svg" width="1830" height="554" viewBox="0 0 1830 554" role="img" aria-labelledby="title desc">
  <title id="title">StickerSwap project hero</title>
  <desc id="desc">A branded StickerSwap hero image with sticker cards, AI workflow labels, and 2026 World Cup collection references.</desc>
  <defs>
    <radialGradient id="glowA" cx="70%" cy="20%" r="60%">
      <stop offset="0" stop-color="#E1FFC1" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#003C47" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#000F2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="18%" cy="78%" r="50%">
      <stop offset="0" stop-color="#A8C3FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000F2C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1830" height="554" fill="#000F2C"/>
  <rect width="1830" height="554" fill="url(#glowA)"/>
  <rect width="1830" height="554" fill="url(#glowB)"/>

  <g transform="translate(120 92)">
    <rect x="0" y="0" width="440" height="82" rx="41" fill="#E1FFC1" stroke="#003C47" stroke-width="4"/>
    <text x="220" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#003C47">Personal MVP</text>
    <text x="0" y="174" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#F8F8F8">StickerSwap</text>
    <text x="0" y="236" font-family="Inter, Arial, sans-serif" font-size="30" fill="#F8F8F8" opacity="0.78">2026 FIFA World Cup Panini collectors</text>
    <text x="0" y="300" font-family="Inter, Arial, sans-serif" font-size="24" fill="#E1FFC1" letter-spacing="4">FIGMA MAKE → MANUAL UI → CODEX → BETA</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(810 80) rotate(-6)">
      <rect width="255" height="340" rx="28" fill="#F8F8F8"/>
      <rect x="22" y="30" width="118" height="28" rx="14" fill="#E1FFC1"/>
      <text x="34" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#003C47">Owned</text>
      <text x="26" y="126" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#003C47">MEX</text>
      <text x="28" y="198" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" fill="#0B2A66">16</text>
      <text x="28" y="260" font-family="Inter, Arial, sans-serif" font-size="20" fill="#343A40">Sticker code</text>
    </g>

    <g transform="translate(1038 130) rotate(4)">
      <rect width="255" height="340" rx="28" fill="#A8C3FF"/>
      <rect x="22" y="30" width="144" height="28" rx="14" fill="#003C47"/>
      <text x="34" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8F8F8">Duplicate</text>
      <text x="26" y="126" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#003C47">POR</text>
      <text x="28" y="198" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" fill="#0B2A66">03</text>
      <text x="28" y="260" font-family="Inter, Arial, sans-serif" font-size="20" fill="#003C47">Trade-ready</text>
    </g>

    <g transform="translate(1264 70) rotate(7)">
      <rect width="255" height="340" rx="28" fill="#F8F8F8"/>
      <rect x="22" y="30" width="124" height="28" rx="14" fill="#003C47"/>
      <text x="34" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8F8F8">Missing</text>
      <text x="26" y="126" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#003C47">BRA</text>
      <text x="28" y="198" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" fill="#0B2A66">08</text>
      <text x="28" y="260" font-family="Inter, Arial, sans-serif" font-size="20" fill="#343A40">Find a match</text>
    </g>
  </g>
</svg>
